name: Database daily report
description: Daily accountability roll-up for all database errors and delivery work.
title: "[DB Daily][YYYY-MM-DD] "
labels:
  - documentation
assignees:
  - chauhansatyam
body:
  - type: markdown
    attributes:
      value: |
        Open one report per working day. Link every open database issue and mention @AbhilashKairali before sign-off. Do not include restricted data.
  - type: input
    id: date
    attributes:
      label: Report date (IST)
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: opening_queue
    attributes:
      label: Opening queue
      description: One line per issue — link, priority, state, owner, next action, blocker.
    validations:
      required: true
  - type: textarea
    id: focus
    attributes:
      label: Today's severity-first plan
      description: State the first issue and the bounded result expected today.
    validations:
      required: true
  - type: textarea
    id: movement
    attributes:
      label: End-of-day movement
      value: |
        Opened:
        Reproduced:
        Fix ready / PR:
        In independent review:
        Verified closed:
        Blocked:
        Carried forward:
    validations:
      required: true
  - type: textarea
    id: urgent
    attributes:
      label: P0/P1 items, blockers, and reviews needed
      description: Name the issue/PR, next action, decision/access needed, and responsible person.
    validations:
      required: true
  - type: textarea
    id: ai
    attributes:
      label: AI used and human checks performed
      description: Link the issue/PR; do not paste sensitive prompts or data.
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: First action for the next working period
    validations:
      required: true
  - type: checkboxes
    id: signoff
    attributes:
      label: End-of-day sign-off
      description: Edit the created issue and check these before sign-off; they are intentionally optional at issue creation.
      options:
        - label: Every database error detected today has its own sanitized GitHub issue.
        - label: Every P0/P1 has a named next action or an explicit blocker.
        - label: I updated all database issues touched today.
        - label: I notified @AbhilashKairali on this report.
