name: CARMA-DB repository control

on:
  pull_request:
    paths:
      - "database-control/**"
      - "monitoring/database-control-*.json"
      - "public/database-control-*.json"
      - "scripts/database-control-*.mjs"
      - "docs/DATABASE_*.md"
      - ".github/workflows/database-control-*.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Validate repository-only CARMA-DB controls
        run: npm run database:control:validate
