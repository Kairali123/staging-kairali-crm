name: CARMA-DB daily control loop

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3,7,11 * * 1-5"
  push:
    branches: [main]
    paths:
      - "database-control/**"
      - "scripts/database-control-*.mjs"
      - "public/database-control-*.json"
      - ".github/workflows/database-control-autopilot.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: carma-db-daily-control-loop
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Refresh repository-visible database inventory
        run: npm run database:control:inventory

      - name: Build the current CARMA-DB plan
        run: npm run database:control:plan

      - name: Verify CARMA-DB safety and evidence rules
        run: npm run database:control:validate

      - name: Update private CARMA-DB dashboard, batch, and focus issues
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const plan = JSON.parse(fs.readFileSync("monitoring/database-control-plan.json", "utf8"));
            const registry = JSON.parse(fs.readFileSync("database-control/asset-registry.json", "utf8"));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labels = [
              { name: "database-control", color: "0e7490" },
              { name: "database-discovery", color: "eab308" },
              { name: "database-decision", color: "d97706" },
              { name: "database-verification", color: "7c3aed" },
              { name: "database-blocked", color: "b91c1c" }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", labels: "database-control", per_page: 100
            });
            const dashboardTitle = "[DB-CARMA Dashboard] Autonomous database delivery";
            const queues = Object.entries(plan.companyQueues).map(([company, queue]) =>
              `| ${company} | ${queue.totalRemaining} | ${queue.dailyTarget} | ${queue.top[0]?.sourcePath || "Complete"} |`
            ).join("\n");
            const dashboardBody = [
              "# CARMA-DB autonomous sprint",
              "",
              `**Generated:** ${plan.generatedAt}`,
              `**Current phase:** ${plan.phase}`,
              `**Mode:** ${plan.mode}`,
              `**First-pass target:** ${plan.inventory.registeredSystems} systems in ${plan.sprint.expectedFirstPassWorkingDays} working days`,
              `**Parallel AI work:** ${plan.preflight.length} / ${plan.controls.maxConcurrentAiCases} cases in the current technical wave`,
              `**Work cadence:** ${plan.sprint.workWavesPerDay} weekday waves × ${plan.sprint.casesPerWorkWave} cases`,
              `**Human decision batch:** ${plan.humanDecisionBatch.length} / ${plan.controls.maxActiveHumanCases}`,
              `**Asset discovery:** ${plan.inventory.discoveryCompleteSystems} / ${plan.inventory.registeredSystems} systems certified; ${plan.inventory.registeredAssets} controlled assets`,
              `**Write-capable paths:** ${registry.summary.writeCapableSystems}`,
              "",
              "| Company | Remaining | Current preflight | Next priority |",
              "| --- | ---: | ---: | --- |",
              queues,
              "",
              "## Inventory-first gate",
              "",
              plan.inventory.repairGate,
              "",
              "## Who acts",
              "",
              "- **CARMA-DB AI:** inventory, prepare evidence, apply policy-safe repository changes, test, monitor and update history.",
              `- **@${plan.ownership.accountableOwner.github}:** data semantics, priority, rollout acceptance and final approval.`,
              `- **@${plan.ownership.independentVerifier.github}:** independently verify query, schema, access, credential, backup, restore and infrastructure changes.`,
              "- **Sponsor:** material escalations and final digest only; routine progress stays with CARMA-DB AI and Satyam.",
              "",
              "## Automatic-action boundary",
              "",
              `Repository writes require at least ${Math.round(plan.controls.automaticRepositoryWriteMinimumConfidence * 100)}% evidence confidence plus backup, rollback, tests and an audit event. Production data, schema, privileges, credentials, firewall, environment and deployment changes remain disabled and gated.`,
              "",
              "_This dashboard is updated by the private CARMA-DB control loop._"
            ].join("\n");
            let dashboard = all.find(issue => !issue.pull_request && issue.title === dashboardTitle);
            if (dashboard) {
              await github.rest.issues.update({ owner, repo, issue_number: dashboard.number, body: dashboardBody, state: "open" });
            } else {
              dashboard = (await github.rest.issues.create({ owner, repo, title: dashboardTitle, body: dashboardBody, labels: ["database-control"] })).data;
            }

            const batchTitle = "[DB-CARMA Batch] Parallel discovery and technical wave";
            const batchBody = [
              "# CARMA-DB parallel work batch",
              "",
              `**Generated:** ${plan.generatedAt}`,
              `**Discovery wave:** ${plan.inventory.discoveryWave.length} / ${plan.inventory.registeredSystems} registered systems`,
              `**Technical preflight wave:** ${plan.preflight.length} / ${plan.controls.maxConcurrentAiCases}`,
              `**Satyam decision batch:** ${plan.humanDecisionBatch.length} / ${plan.controls.maxActiveHumanCases}`,
              "",
              "## Company allocation",
              "",
              ...Object.entries(plan.companyQueues).map(([company, queue]) => `- **${company}:** ${queue.dailyTarget} technical preflights; ${queue.totalRemaining} remaining`),
              "",
              "## Current technical wave",
              "",
              ...plan.preflight.map(item => `- ${item.systemId} · ${item.company} · \`${item.sourcePath}\` · ${item.suggestedAction}`),
              "",
              "## Human decisions ready",
              "",
              ...(plan.humanDecisionBatch.length
                ? plan.humanDecisionBatch.map(item => `- ${item.systemId} · \`${item.sourcePath}\` · ${item.nextHumanDecision}`)
                : ["No decision requested yet. CARMA-DB AI continues discovery without waiting for Satyam."]),
              "",
              "Every system retains its own evidence, tests, change history and rollback record. Parallel throughput does not weaken the database safety gates."
            ].join("\n");
            let batch = all.find(issue => !issue.pull_request && issue.title === batchTitle);
            const batchLabels = plan.humanDecisionBatch.length
              ? ["database-control", "database-decision"]
              : ["database-control", "database-discovery"];
            const batchAssignees = plan.humanDecisionBatch.length
              ? [plan.ownership.accountableOwner.github]
              : [];
            if (batch) {
              await github.rest.issues.update({ owner, repo, issue_number: batch.number, body: batchBody, state: "open", labels: batchLabels, assignees: batchAssignees });
            } else {
              await github.rest.issues.create({ owner, repo, title: batchTitle, body: batchBody, labels: batchLabels, assignees: batchAssignees });
            }

            if (plan.activeCase) {
              const active = plan.activeCase;
              const title = `[DB-CARMA Focus][${active.systemId}] ${active.sourcePath}`;
              const body = [
                `# CARMA-DB focus case · ${active.company}`,
                "",
                "This focus view does not block the other parallel AI cases.",
                "",
                `**System:** ${active.systemId} · \`${active.sourcePath}\``,
                `**Priority:** ${active.priority}`,
                `**Risk score:** ${active.riskScore}`,
                `**Write-capable:** ${active.writeCapable ? "yes" : "no"}`,
                `**Repository-visible objects:** ${active.objects.length ? active.objects.join(", ") : "none extracted"}`,
                `**Suggested AI action:** ${active.suggestedAction}`,
                "",
                "## Missing or unverified coverage",
                "",
                ...active.missingCoverage.map(item => `- ${item}`),
                "",
                "## Responsibility",
                "",
                `- CARMA-DB AI completes the evidence packet first and does not wait for routine input.`,
                `- @${plan.ownership.accountableOwner.github} decides data semantics, business validity, priority and rollout acceptance.`,
                `- @${plan.ownership.independentVerifier.github} independently verifies any higher-risk database or infrastructure change.`,
                "",
                "Production database mutations are disabled. Closure requires evidence, regression proof, rollback, independent review where required, and Satyam's approval."
              ].join("\n");
              let issue = all.find(item => !item.pull_request && item.title === title);
              if (issue) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, body, state: "open", labels: ["database-control", "database-discovery"], assignees: [plan.ownership.accountableOwner.github] });
              } else {
                await github.rest.issues.create({ owner, repo, title, body, labels: ["database-control", "database-discovery"], assignees: [plan.ownership.accountableOwner.github] });
              }
            }

      - name: Upload CARMA-DB plan evidence
        uses: actions/upload-artifact@v7
        with:
          name: carma-db-plan-${{ github.run_number }}
          path: |
            monitoring/database-control-plan.json
            database-control/asset-registry.json
          retention-days: 30
